2024.07 — 2024.08','使用 FineBI 与 Excel 完成活动数据、用户反馈的可视化汇总，为阶段性营销决策提供数据支持。',['数据分析','FineBI','Excel']],skills:['TOOLKIT · RIGHT SHOULDER','计划与数据工具箱','','能够独立完成销售与库存报表、采购需求拆解、库存预警及基础数据分析。',['Excel','SQL','Python','FineBI','聚水潭 ERP']]};const zone=document.querySelector('#zone');const show=k=>{const d=data[k];ey.textContent=d[0];title.textContent=d[1];time.textContent=d[2];body.textContent=d[3];tags.innerHTML=d[4].map(x=>'<span>'+x+'</span>').join('');document.querySelectorAll('.spot').forEach(x=>x.classList.toggle('active',x.dataset.key===k))};show('about');document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('mouseenter',()=>show(el.dataset.key));el.addEventListener('click',()=>show(el.dataset.key))});zone.addEventListener('pointermove',e=>{const r=zone.getBoundingClientRect();zone.style.setProperty('--x',Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1)).toFixed(3));zone.style.setProperty('--y',Math.max(-1,Math.min(1,(e.clientY-r.top)/r.height*2-1)).toFixed(3))});zone.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')show('about');zone.style.setProperty('--x',0);zone.style.setProperty('--y',0)});</script></body></html>
