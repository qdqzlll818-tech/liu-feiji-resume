name: Deploy resume to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portrait and resume
        run: |
          curl --fail --location --retry 3 "https://liu-feiji-interactive-resume.candid-lemon-9966.chatgpt.site/avatar.png" --output avatar.png
          curl --fail --location --retry 3 "https://liu-feiji-interactive-resume.candid-lemon-9966.chatgpt.site/resume.pdf" --output resume.pdf
          test "$(wc -c < avatar.png)" -gt 1000000
          test "$(wc -c < resume.pdf)" -gt 300000
          sed -i 's~<a href="mailto:qdqzlll818@gmail.com">CONTACT ↗</a>~<div class="topActions"><a href="resume.pdf" target="_blank" rel="noreferrer">完整简历 ↗</a><a href="https://mail.google.com/mail/?view=cm\&fs=1\&to=qdqzlll818@gmail.com" target="_blank" rel="noreferrer" title="发送邮件至 qdqzlll818@gmail.com">CONTACT ↗</a></div>~' index.html
          sed -i 's~</body>~<style>@media(min-width:901px){.guide{display:grid!important}}.topActions{display:flex;align-items:center;gap:8px}.spot{background:transparent!important;border-color:transparent!important}.spot:after{inset:11px;border:0;opacity:.5;box-shadow:0 0 0 3px #c9ef6660;animation:spotPulse 2.4s ease-in-out infinite}.spot:hover,.spot.active{border-color:#23251f73!important;background:#f5f9e148!important}.spot:hover:after,.spot.active:after{inset:9px;border:1px solid;opacity:1;animation:none}.spot:hover span,.spot.active span{opacity:1}@keyframes spotPulse{0%,100%{transform:scale(.85);opacity:.3}50%{transform:scale(1.15);opacity:.68}}</style><script>document.querySelectorAll(".portrait img").forEach(function(i){i.src="avatar.png"})</script></body>~' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
